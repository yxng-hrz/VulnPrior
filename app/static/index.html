<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VulnPrior - CISO Vulnerability Prioritization</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">CISO DECISION SUPPORT</p>
        <h1>VulnPrior</h1>
        <p class="lead">Turn technical vulnerabilities into business remediation priorities.</p>
      </div>
      <div class="links">
        <a href="/docs">OpenAPI docs</a>
        <a href="/health">Health</a>
      </div>
    </header>

    <section id="summary" class="cards"></section>

    <section class="panel">
      <div class="panel-title">
        <div>
          <p class="eyebrow">PRIORITIZED QUEUE</p>
          <h2>Top findings</h2>
        </div>
        <button id="refresh">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Risk</th>
              <th>Asset</th>
              <th>CVE</th>
              <th>CVSS</th>
              <th>EPSS</th>
              <th>KEV</th>
              <th>Decision</th>
              <th>SLA</th>
            </tr>
          </thead>
          <tbody id="findings"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <p class="eyebrow">MANAGEMENT VIEW</p>
      <h2>Why this matters</h2>
      <p id="explanation">Load demo data to display an executive explanation.</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
